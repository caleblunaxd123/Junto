name: JUNTO quality
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run test --workspace=apps/api
      - run: node ops/test-mobile-ux.cjs
      - run: node --test ops/test-currency.cjs
      - run: node ops/test-release-config.cjs
      - run: node --test ops/test-dialogs.cjs
      - run: node --test ops/test-bill-validation.cjs
      - run: node --test ops/test-sharing.cjs
      - run: node --test ops/test-share-email.cjs
      - run: node --test ops/test-email.cjs
      - run: node --test ops/test-money-scenarios.cjs
      - run: node --test ops/test-ui-patterns.cjs
      - run: node --test ops/test-payment-ux.cjs
      - run: node --test ops/test-local-qa.cjs
      - run: node --test ops/test-push-transport.cjs
      - run: node --test ops/test-home-ux.cjs
      - run: node --test ops/test-notification-ux.cjs
      - run: node --test ops/test-first-steps-chat.cjs
      - run: node --test ops/test-dictation.cjs
      - run: node --test ops/test-group-contribution.cjs
      - run: node --test ops/test-group-chat-read.cjs
      - run: node --test ops/test-statement-ui.cjs ops/test-group-lifecycle-ui.cjs ops/test-contabo-config.cjs
      - run: node --test ops/web/test-server.cjs
      - run: node --test ops/test-native-lock.cjs
      - run: npm run build:api
      - run: npm run typecheck --workspace=apps/mobile
      - run: npm run lint --workspace=apps/mobile
      - name: Build the production web app with public configuration only
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_URL: https://junto.lunalav.pe
          EXPO_PUBLIC_WEB_URL: https://junto.lunalav.pe/app/
          EXPO_PUBLIC_PRIVACY_URL: https://junto.lunalav.pe/privacidad
          EXPO_PUBLIC_DELETE_ACCOUNT_URL: https://junto.lunalav.pe/eliminar-cuenta
          EXPO_PUBLIC_SUPPORT_EMAIL: soporte@lunalav.pe
          JUNTO_WEB_BASE_PATH: /app
        run: |
          export EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$(node -p "require('../../ops/android/google-beta.public.json').webClientId")
          npx --no-install expo export --platform web --output-dir dist-ci

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: junto
          POSTGRES_PASSWORD: junto
          POSTGRES_DB: junto_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U junto -d junto_db" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://junto:junto@localhost:5432/junto_db
      JWT_SECRET: ci_only_secret_for_integration_tests_0123456789
      PORT: 3005
      NODE_ENV: test
      GOOGLE_CLIENT_IDS: 000000000000-ci.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      # Production must be reproducible from the versioned migrations alone.
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Schema and migrations agree
        run: |
          drift=$(npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --script)
          echo "$drift"
          echo "$drift" | grep -q "This is an empty migration" || (echo "schema.prisma changed without a migration" && exit 1)
      - run: npm run build:api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the synthetic OCR fixture dependency
        run: python -m pip install Pillow==12.3.0
      - name: Account deletion end to end
        run: |
          node apps/api/dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3005/health && break; sleep 1; done
          node ops/test-account-deletion.cjs || (cat api.log && exit 1)
          node ops/test-google-sign-in.cjs || (cat api.log && exit 1)
          node ops/test-expense-idempotency.cjs || (cat api.log && exit 1)
          node ops/test-share-email-api.cjs || (cat api.log && exit 1)
          node ops/test-vouchers-comments.cjs || (cat api.log && exit 1)
          node ops/test-quick-bills.cjs || (cat api.log && exit 1)
          node ops/test-hardening.cjs || (cat api.log && exit 1)
          node ops/test-security-ux.cjs || (cat api.log && exit 1)
          node ops/test-redesign.cjs || (cat api.log && exit 1)
          node ops/test-push.cjs || (cat api.log && exit 1)
          node ops/test-groups-ledger.cjs || (cat api.log && exit 1)
          node ops/test-group-join-notices.cjs || (cat api.log && exit 1)
          node ops/test-bill-parts.cjs || (cat api.log && exit 1)
          node ops/test-members-by-name.cjs || (cat api.log && exit 1)
          node ops/test-group-imports.cjs || (cat api.log && exit 1)
          node ops/test-admin-received.cjs || (cat api.log && exit 1)
          node ops/test-currency-api.cjs || (cat api.log && exit 1)
          node ops/test-payment-flow.cjs || (cat api.log && exit 1)
          node ops/test-chat-updates.cjs || (cat api.log && exit 1)
          node ops/test-ledger-concurrency.cjs || (cat api.log && exit 1)
          node ops/test-shares-simplify.cjs || (cat api.log && exit 1)
          node ops/test-statement-api.cjs || (cat api.log && exit 1)
          node ops/test-group-lifecycle.cjs || (cat api.log && exit 1)
          node ops/test-received-voucher.cjs || (cat api.log && exit 1)
          node ops/test-recurring-expenses.cjs || (cat api.log && exit 1)
          node ops/test-household-budget.cjs || (cat api.log && exit 1)
          node ops/test-account-email-api.cjs || (cat api.log && exit 1)

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -f ops/contabo/Dockerfile -t junto-api:ci .
      - name: Audit only packages shipped in the production image
        run: docker run --rm --entrypoint npm junto-api:ci audit --omit=dev --audit-level=high
      - run: node ops/test-production-image.cjs junto-api:ci
