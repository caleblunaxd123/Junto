services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: junto-ai-gateway
    restart: unless-stopped
    environment:
      JUNTO_AI_API_KEY: ${JUNTO_AI_API_KEY:?Define JUNTO_AI_API_KEY in .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
    expose:
      - "8080"
    networks:
      - default
      - stack_web
    cpus: 0.5
    mem_limit: 128m
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    container_name: junto-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    cpus: 3.0
    mem_limit: 4608m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  ollama_data:

networks:
  stack_web:
    external: true
    name: stack_web
