name: junto-beta
services:
  web:
    image: ${JUNTO_WEB_IMAGE:?Specify the tested web image}
    restart: unless-stopped
    init: true
    networks:
      web:
        aliases: [junto-beta-web]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  web:
    external: true
    name: stack_web
